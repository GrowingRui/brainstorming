<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Precision Roller | Pro Edition</title>
<style>
    body {
        background: #0f0f0f;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    #ui {
        position: absolute;
        top: 25px;
        text-align: center;
        pointer-events: none;
    }

    h1 {
        margin: 0;
        font-size: 36px;
        letter-spacing: 5px;
        color: #3498db;
        text-shadow: 0 0 20px rgba(52, 152, 219, 0.4);
    }

    .info {
        color: #555;
        font-size: 12px;
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    canvas {
        background: #000;
        box-shadow: 0 0 80px rgba(0, 0, 0, 1);
        border: 1px solid #222;
        border-radius: 4px;
    }

    #message {
        position: absolute;
        bottom: 70px;
        font-size: 24px;
        font-weight: bold;
        text-transform: uppercase;
    }

    .controls {
        position: absolute;
        bottom: 25px;
        color: #444;
        font-size: 11px;
        display: flex;
        gap: 20px;
    }
</style>
</head>
<body>

<div id="ui">
    <h1>PRECISION ROLLER</h1>
    <div class="info">Complex Path Algorithm • Large Map</div>
</div>

<canvas id="game"></canvas>
<div id="message"></div>

<div class="controls">
    <span>[ARROWS] MOVE</span>
    <span>[R] RESET LEVEL</span>
</div>

<script>
/**
 * PROFESSIONAL GAME LOGIC - ENHANCED DIFFICULTY
 * 1. Larger Grid (32x18)
 * 2. Longer recursive path generation (120 steps)
 * 3. Narrower "Cluster" fill to increase risk of falling
 */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("message");

const TILE = 32; // Smaller tiles for a larger map
const COLS = 32; 
const ROWS = 18;

let map = [];
let block = {};
let target = { x: 0, y: 0 };
let gameOver = false;

// Movement Simulation State Machine
function simulate(b, dir) {
    let r = JSON.parse(JSON.stringify(b));
    if (r.state === "standing") {
        if (dir === "left") { r.x1 -= 2; r.x2 = r.x1 + 1; r.y2 = r.y1; r.state = "lying_h"; }
        else if (dir === "right") { r.x1 += 1; r.x2 = r.x1 + 1; r.y2 = r.y1; r.state = "lying_h"; }
        else if (dir === "up") { r.y1 -= 2; r.y2 = r.y1 + 1; r.x2 = r.x1; r.state = "lying_v"; }
        else if (dir === "down") { r.y1 += 1; r.y2 = r.y1 + 1; r.x2 = r.x1; r.state = "lying_v"; }
    } 
    else if (r.state === "lying_h") {
        if (dir === "left") { r.x1 -= 1; r.x2 = r.x1; r.state = "standing"; }
        else if (dir === "right") { r.x1 += 2; r.x2 = r.x1; r.state = "standing"; }
        else if (dir === "up") { r.y1 -= 1; r.y2 -= 1; }
        else if (dir === "down") { r.y1 += 1; r.y2 += 1; }
    } 
    else if (r.state === "lying_v") {
        if (dir === "left") { r.x1 -= 1; r.x2 -= 1; }
        else if (dir === "right") { r.x1 += 1; r.x2 += 1; }
        else if (dir === "up") { r.y1 -= 1; r.y2 = r.y1; r.state = "standing"; }
        else if (dir === "down") { r.y1 += 2; r.y2 = r.y1; r.state = "standing"; }
    }
    return r;
}

function generateMap() {
    map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    
    // Start target at a random corner quadrant
    target.x = Math.floor(Math.random() * 6) + (Math.random() > 0.5 ? 22 : 4);
    target.y = Math.floor(Math.random() * 4) + (Math.random() > 0.5 ? 12 : 2);
    map[target.y][target.x] = 2;

    let cur = { x1: target.x, y1: target.y, x2: target.x, y2: target.y, state: "standing" };
    let pathHistory = [];

    // Difficulty Increase: 120 iterations for longer paths
    for (let i = 0; i < 120; i++) {
        map[cur.y1][cur.x1] = 1;
        pathHistory.push({x: cur.x1, y: cur.y1});
        if (cur.state !== "standing") {
            map[cur.y2][cur.x2] = 1;
            pathHistory.push({x: cur.x2, y: cur.y2});
        }

        let dirs = ["up", "down", "left", "right"];
        let next = simulate(cur, dirs[Math.floor(Math.random() * 4)]);

        if (next.x1 >= 1 && next.x1 < COLS - 1 && next.y1 >= 1 && next.y1 < ROWS - 1 &&
            next.x2 >= 1 && next.x2 < COLS - 1 && next.y2 >= 1 && next.y2 < ROWS - 1) {
            cur = next;
        }
    }

    block = { x1: cur.x1, y1: cur.y1, x2: cur.x2, y2: cur.y2, state: cur.state };

    // Sparsity Adjustment: Less neighboring tiles makes it "harder" (narrower paths)
    pathHistory.forEach(pos => {
        const neighbors = [[1,0], [-1,0], [0,1], [0,-1]];
        neighbors.forEach(([dx, dy]) => {
            let nx = pos.x + dx, ny = pos.y + dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                if (map[ny][nx] === 0 && Math.random() > 0.7) { // Only 30% chance to fill
                    map[ny][nx] = 1;
                }
            }
        });
    });

    map[target.y][target.x] = 2; // Keep target visible
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const ox = (canvas.width - COLS * TILE) / 2;
    const oy = (canvas.height - ROWS * TILE) / 2;

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (map[y][x] === 0) continue;
            ctx.fillStyle = (map[y][x] === 2) ? "#e74c3c" : "#1a252f";
            ctx.fillRect(x * TILE + ox, y * TILE + oy, TILE - 1, TILE - 1);
            
            ctx.strokeStyle = "rgba(255,255,255,0.03)";
            ctx.strokeRect(x * TILE + ox, y * TILE + oy, TILE - 1, TILE - 1);
        }
    }

    ctx.fillStyle = "#f1c40f"; // Gold Player
    ctx.shadowBlur = 10;
    ctx.shadowColor = "rgba(241, 196, 15, 0.4)";
    ctx.fillRect(block.x1 * TILE + ox + 3, block.y1 * TILE + oy + 3, TILE - 6, TILE - 6);
    if (block.state !== "standing") {
        ctx.fillRect(block.x2 * TILE + ox + 3, block.y2 * TILE + oy + 3, TILE - 6, TILE - 6);
    }
}

function check() {
    const isVoid = (x, y) => x < 0 || x >= COLS || y < 0 || y >= ROWS || map[y][x] === 0;

    if (isVoid(block.x1, block.y1) || (block.state !== "standing" && isVoid(block.x2, block.y2))) {
        end("FALLEN!", "#e74c3c");
    } else if (block.state === "standing" && map[block.y1][block.x1] === 2) {
        end("STAGE CLEARED!", "#2ecc71");
    }
}

function end(t, c) {
    gameOver = true;
    msg.textContent = t;
    msg.style.color = c;
    setTimeout(start, 1500);
}

function start() {
    msg.textContent = "";
    gameOver = false;
    generateMap();
    draw();
}

window.addEventListener("keydown", e => {
    if (gameOver) return;
    const keyMap = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
    if (keyMap[e.key]) {
        e.preventDefault();
        block = simulate(block, keyMap[e.key]);
        check();
        draw();
    }
    if (e.key.toLowerCase() === 'r') start();
});

window.onload = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    start();
};

window.onresize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
};
</script>
</body>
</html>
