<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Game Arcade</h1>
        <p>Pick a game and start playing!</p>
    </header>

    <main class="game-grid">
        <div class="game-card" onclick="openGame('game1/index.html', 'Snake Pro')">
            <img src="images/snake.jpg" alt="Snake Game Preview">
            <div class="game-info">
                <h3>Snake Pro</h3>
                <p>Classic arcade action. Use arrow keys to grow.</p>
            </div>
        </div>

        <div class="game-card" onclick="openGame('game2/index.html', 'Space Shooter')">
            <img src="images/space.jpg" alt="Space Shooter Preview">
            <div class="game-info">
                <h3>Space Shooter</h3>
                <p>Protect the galaxy from invading aliens.</p>
            </div>
        </div>

        </main>

    <div id="game-overlay">
        <div class="overlay-bar">
            <span id="game-title-display">Loading...</span>
            <button class="exit-button" onclick="closeGame()">EXIT GAME</button>
        </div>
        <iframe id="game-iframe" src=""></iframe>
    </div>

    <script>
        const overlay = document.getElementById('game-overlay');
        const iframe = document.getElementById('game-iframe');
        const titleDisplay = document.getElementById('game-title-display');

        // 打开游戏：传入路径和游戏名称
        function openGame(url, title) {
            titleDisplay.innerText = title;
            iframe.src = url;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // 防止主页面在后台滚动
        }

        // 关闭游戏
        function closeGame() {
            overlay.style.display = 'none';
            iframe.src = ''; // 清空 src 会立即停止游戏声音和运行
            document.body.style.overflow = 'auto';
        }

        // 允许按 ESC 键退出游戏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGame();
        });
    </script>
</body>
</html>
