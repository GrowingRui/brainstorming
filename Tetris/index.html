<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Evolution</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-color: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 25px;
            background: var(--panel-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        canvas {
            border: 3px solid #21262d;
            background-color: #010409;
            display: block;
            border-radius: 4px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 110px;
        }

        .stat-box {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-label { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            color: #8b949e; 
            margin-bottom: 5px;
        }
        
        .stat-value { 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: var(--accent-color); 
        }

        #controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:active { 
            background: var(--accent-color); 
            transform: scale(0.95);
        }

        .reset-btn {
            background: #238636;
            border: none;
            margin-top: 10px;
        }

        @media (max-width: 650px) {
            #game-container { flex-direction: column; padding: 15px; }
            .side-panel { flex-direction: row; gap: 10px; min-width: auto; }
            #controls { display: grid; }
            .stat-box { flex: 1; padding: 10px; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <div class="side-panel">
        <div class="stat-box">
            <div class="stat-label">SCORE</div>
            <div id="score" class="stat-value">0</div>
        </div>
        
        <div class="stat-box">
            <div class="stat-label">NEXT</div>
            <canvas id="next" width="80" height="80"></canvas>
        </div>

        <button class="btn reset-btn" onclick="resetGame()">RESET</button>
    </div>
</div>

<div id="controls">
    <button class="btn" onclick="playerMove(-1)">LEFT</button>
    <button class="btn" onclick="playerRotate(1)">ROTATE</button>
    <button class="btn" onclick="playerMove(1)">RIGHT</button>
    <div></div>
    <button class="btn" onclick="playerDrop()">DOWN</button>
    <div></div>
</div>

<script>
    // Constants & Pieces
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    context.scale(20, 20);
    nextContext.scale(20, 20);

    const colors = [
        null, '#ff5e57', '#00d8ff', '#05c46b', '#ef57ff', '#ffa801', '#ffdd59', '#3c40c6',
    ];

    function createPiece(type) {
        if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
        else if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
        else if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
        else if (type === 'O') return [[4, 4], [4, 4]];
        else if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
        else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        else if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
    }

    // Logic Functions
    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function draw() {
        context.fillStyle = '#010409';
        context.fillRect(0, 0, canvas.width, canvas.height);
        
        drawMatrix(arena, {x: 0, y: 0}, context);
        drawMatrix(player.matrix, player.pos, context);
        
        nextContext.fillStyle = '#0d1117';
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        drawMatrix(player.next, {x: 1, y: 1}, nextContext);
    }

    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    ctx.lineWidth = 0.05;
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += rowCount * 10;
            rowCount *= 2;
        }
        updateScore();
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        if (!player.next) {
            player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        }
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        
        if (collide(arena, player)) {
            // Game Over Log Point
            console.log("Game Over. Score:", player.score);
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
    }

    function resetGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
        playerReset();
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0 };

    document.addEventListener('keydown', event => {
        if (event.keyCode === 37) playerMove(-1);
        else if (event.keyCode === 39) playerMove(1);
        else if (event.keyCode === 40) playerDrop();
        else if (event.keyCode === 38 || event.keyCode === 87) playerRotate(1);
    });

    playerReset();
    updateScore();
    update();
</script>
</body>
</html>
