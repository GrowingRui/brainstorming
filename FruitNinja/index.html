<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水果忍者 HTML5</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #222;
            font-family: 'Arial', sans-serif;
            touch-action: none; /* 防止移动端缩放和滚动 */
        }
        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #4a3000 0%, #2b1d00 100%);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            text-align: center;
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            background: #44aa44;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="ui">得分: <span id="score">0</span></div>
    
    <div id="gameOver">
        <h1>游戏结束!</h1>
        <p>切到了炸弹！</p>
        <button onclick="resetGame()">重新开始</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOver');

    let width, height, score, gameActive;
    let fruits = [];
    let particles = [];
    let blade = []; // 存储切割轨迹轨迹
    let lastSpawnTime = 0;

    // 游戏配置
    const CONFIG = {
        gravity: 0.15,
        spawnInterval: 1000, // 毫秒
        fruitColors: ['#ff4444', '#ffeb3b', '#4caf50', '#ff9800', '#9c27b0'],
        bombColor: '#333'
    };

    function init() {
        resize();
        resetGame();
        animate();
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    function resetGame() {
        score = 0;
        scoreEl.innerText = score;
        fruits = [];
        particles = [];
        blade = [];
        gameActive = true;
        gameOverEl.style.display = 'none';
    }

    class GameObject {
        constructor(isBomb = false) {
            this.isBomb = isBomb;
            this.radius = isBomb ? 30 : 35 + Math.random() * 15;
            this.x = Math.random() * (width - 100) + 50;
            this.y = height + this.radius;
            
            // 初始速度：向上喷射
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = -(Math.random() * 5 + 10);
            
            this.color = isBomb ? CONFIG.bombColor : CONFIG.fruitColors[Math.floor(Math.random() * CONFIG.fruitColors.length)];
            this.isSliced = false;
        }

        update() {
            this.vy += CONFIG.gravity;
            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            
            // 炸弹画个引信效果
            if (this.isBomb) {
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            ctx.closePath();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1.0;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }

        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    }

    function spawnFruit() {
        const isBomb = Math.random() < 0.15; // 15% 概率生成炸弹
        fruits.push(new GameObject(isBomb));
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function checkCollision() {
    if (blade.length < 2) return;

    for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.isSliced) continue;

        const p1 = blade[blade.length - 2];
        const p2 = blade[blade.length - 1];

        // --- 修复逻辑：线段最近点判定 ---
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const l2 = dx * dx + dy * dy;
        if (l2 === 0) continue;

        // 计算投影比例 t
        let t = ((f.x - p1.x) * dx + (f.y - p1.y) * dy) / l2;
        // 限制 t 在 [0, 1] 之间，确保只在这一段指尖轨迹内判定
        t = Math.max(0, Math.min(1, t));

        const closestX = p1.x + t * dx;
        const closestY = p1.y + t * dy;

        const distX = f.x - closestX;
        const distY = f.y - closestY;
        const distance = Math.sqrt(distX * distX + distY * distY);

        // 适当调小判定半径（例如乘以 0.8），让玩家感觉必须“切中中心”
        if (distance < f.radius * 0.8) {
            if (f.isBomb) {
                endGame();
            } else {
                f.isSliced = true;
                score += 10;
                scoreEl.innerText = score;
                createExplosion(f.x, f.y, f.color);
                fruits.splice(i, 1);
            }
        }
    }
}

    function endGame() {
        gameActive = false;
        gameOverEl.style.display = 'block';
    }

    function animate(time) {
        if (!gameActive) return requestAnimationFrame(animate);

        ctx.clearRect(0, 0, width, height);

        // 生成物体
        if (time - lastSpawnTime > CONFIG.spawnInterval) {
            spawnFruit();
            lastSpawnTime = time;
        }

        // 更新并绘制水果
        for (let i = fruits.length - 1; i >= 0; i--) {
            fruits[i].update();
            fruits[i].draw();
            // 掉出屏幕移除
            if (fruits[i].y > height + 100) fruits.splice(i, 1);
        }

        // 更新并绘制粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        // 绘制刀锋轨迹
        if (blade.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.lineJoin = 'round';
            ctx.moveTo(blade[0].x, blade[0].y);
            for (let i = 1; i < blade.length; i++) {
                ctx.lineTo(blade[i].x, blade[i].y);
            }
            ctx.stroke();
            checkCollision();
            // 轨迹淡出
            blade.shift(); 
        }

        requestAnimationFrame(animate);
    }

    // 事件监听
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointermove', (e) => {
        if (!gameActive) return;
        blade.push({ x: e.clientX, y: e.clientY });
        if (blade.length > 10) blade.shift();
    });

    canvas.addEventListener('pointerdown', (e) => {
        blade = [{ x: e.clientX, y: e.clientY }];
    });

    canvas.addEventListener('pointerup', () => {
        blade = [];
    });

    init();
</script>
</body>
</html>
