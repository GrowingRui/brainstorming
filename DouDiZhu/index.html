<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>斗地主 - 12种全牌型版</title>
    <style>
        :root { --card-bg: #fff; --card-selected: #e0f7fa; --table-color: #1b5e20; }
        body { background: #222; font-family: "Microsoft YaHei", sans-serif; margin: 0; overflow: hidden; color: white; }
        #game-table { width: 100vw; height: 100vh; background: var(--table-color); position: relative; display: flex; flex-direction: column; }
        
        /* 顶部栏 */
        .info-bar { height: 60px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .dipai { display: flex; gap: 8px; }
        .mini-card { width: 35px; height: 50px; background: white; color: black; border-radius: 4px; text-align: center; line-height: 50px; font-weight: bold; font-size: 14px; }

        /* 右上角退出 */
        .exit-link { position: absolute; top: 15px; right: 20px; color: #ff5252; text-decoration: none; font-weight: bold; cursor: pointer; z-index: 1000; font-size: 16px; border: 1px solid #ff5252; padding: 5px 15px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .exit-link:hover { background: #ff5252; color: white; }

        .play-area { flex: 1; position: relative; }
        .player-hand { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; height: 120px; align-items: flex-end; }
        .ai-side { position: absolute; top: 80px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        #ai1 { left: 30px; } #ai2 { right: 30px; }
        .role-tag { font-size: 12px; padding: 2px 6px; border-radius: 3px; margin-left: 5px; font-weight: bold; }
        .tag-dizhu { background: #f44336; color: #fff; }
        .tag-nongmin { background: #2196f3; color: #fff; }

        .timer-container { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); width: 200px; text-align: center; display: none; }
        #timer-text { font-size: 22px; font-weight: bold; color: #ffeb3b; text-shadow: 1px 1px 2px #000; }
        .timer-progress { width: 100%; height: 6px; background: #444; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        #timer-bar { height: 100%; width: 100%; background: #ffeb3b; transition: width 1s linear; }

        .card { 
            width: 80px; height: 120px; background: var(--card-bg); border: 1px solid #666; 
            border-radius: 8px; color: black; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 8px; cursor: pointer; 
            user-select: none; transition: transform 0.1s; box-shadow: 2px 2px 8px rgba(0,0,0,0.4); margin-left: -48px;
        }
        .card:first-child { margin-left: 0; }
        .card.selected { transform: translateY(-30px); background: var(--card-selected); z-index: 100; }
        .card.red { color: #d32f2f; }
        
        .desk { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 5px; min-height: 120px; }
        
        .controls { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; }
        button { padding: 12px 35px; font-size: 18px; cursor: pointer; border: none; border-radius: 6px; background: #ff9800; color: white; font-weight: bold; box-shadow: 0 4px 0 #e68a00; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #e68a00; }

        #log { position: absolute; bottom: 10px; right: 10px; width: 260px; height: 150px; background: rgba(0,0,0,0.6); font-size: 13px; overflow-y: auto; padding: 10px; border-radius: 5px; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="game-table">
    <div class="exit-link" onclick="game.exitGame()">退出游戏</div>
    
    <div class="info-bar">
        <div>身份: <span id="my-role">-</span></div>
        <div class="dipai" id="dipai-area"></div>
        <div>回合: <b id="current-turn">-</b></div>
    </div>

    <div class="play-area">
        <div id="ai1" class="ai-side">AI 1 <span id="tag1"></span><br>剩: <b id="count1">17</b></div>
        <div id="ai2" class="ai-side">AI 2 <span id="tag2"></span><br>剩: <b id="count2">17</b></div>
        <div class="desk" id="desk-cards"></div>
        <div class="timer-container" id="timer-ui">
            <div id="timer-text">15s</div>
            <div class="timer-progress"><div id="timer-bar"></div></div>
        </div>
        <div class="controls" id="btn-group" style="display:none">
            <button onclick="game.playCards()">出牌</button>
            <button onclick="game.passTurn()">不出</button>
        </div>
        <div class="player-hand" id="player-cards"></div>
    </div>

    <div id="log"></div>
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center" id="start-screen">
        <h1 style="font-size:50px; text-shadow:0 0 20px rgba(0,0,0,0.5)">斗地主</h1>
        <button onclick="game.init()" style="font-size:24px; padding:15px 50px">开始游戏</button>
    </div>
</div>

<script>
const VALUES = {'3':3,'4':4,'5':5,'6':6,'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14,'2':15,'小王':16,'大王':17};

class Game {
    constructor() {
        this.resetState();
    }

    resetState() {
        this.players = [[], [], []];
        this.landlordIdx = -1;
        this.turn = 0;
        this.lastMove = { playerIdx: -1, cards: [] }; 
        this.selectedIndices = new Set();
        this.timer = null;
        this.timeLeft = 15;
    }

    log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += `<div>${msg}</div>`;
        l.scrollTop = l.scrollHeight;
    }

    exitGame() {
        if(confirm("确定要退出吗？")) location.reload();
    }

    init() {
        this.resetState();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('log').innerHTML = '';
        
        let deck = [];
        for (let n in VALUES) {
            if (n.includes('王')) deck.push({ name: n, val: VALUES[n], red: n==='大王' });
            else ['♠','♥','♣','♦'].forEach(s => deck.push({ name:n, val:VALUES[n], suit:s, red:(s==='♥'||s==='♦') }));
        }
        deck.sort(() => Math.random() - 0.5);

        this.players = [deck.slice(0, 17), deck.slice(17, 34), deck.slice(34, 51)];
        this.dipai = deck.slice(51);

        this.landlordIdx = Math.floor(Math.random() * 3);
        this.players[this.landlordIdx].push(...this.dipai);
        this.turn = this.landlordIdx; 
        
        this.players.forEach((_, i) => this.sortHand(i));
        this.updateUI();
        this.log(`游戏开始！地主是：${this.landlordIdx === 0 ? '你' : 'AI ' + this.landlordIdx}`);
        this.startTurn();
    }

    updateUI() {
        document.getElementById('my-role').innerHTML = this.landlordIdx === 0 ? '<span class="role-tag tag-dizhu">地主</span>' : '<span class="role-tag tag-nongmin">农民</span>';
        document.getElementById('tag1').className = 'role-tag ' + (this.landlordIdx === 1 ? 'tag-dizhu' : 'tag-nongmin');
        document.getElementById('tag1').innerText = this.landlordIdx === 1 ? '地主' : '农民';
        document.getElementById('tag2').className = 'role-tag ' + (this.landlordIdx === 2 ? 'tag-dizhu' : 'tag-nongmin');
        document.getElementById('tag2').innerText = this.landlordIdx === 2 ? '地主' : '农民';
        
        const area = document.getElementById('dipai-area');
        area.innerHTML = '';
        this.dipai.forEach(c => area.innerHTML += `<div class="mini-card ${c.red?'red':''}">${c.name}</div>`);
        this.renderPlayerCards();
    }

    sortHand(idx) { this.players[idx].sort((a, b) => b.val - a.val); }

    renderPlayerCards() {
        const container = document.getElementById('player-cards');
        container.innerHTML = '';
        this.players[0].forEach((card, index) => {
            const div = document.createElement('div');
            div.className = `card ${card.red ? 'red' : ''} ${this.selectedIndices.has(index) ? 'selected' : ''}`;
            div.innerHTML = `<div>${card.name}</div><div style="font-size:24px">${card.suit || ''}</div>`;
            div.onclick = () => {
                if (this.selectedIndices.has(index)) this.selectedIndices.delete(index);
                else this.selectedIndices.add(index);
                this.renderPlayerCards();
            };
            container.appendChild(div);
        });
        document.getElementById('count1').innerText = this.players[1].length;
        document.getElementById('count2').innerText = this.players[2].length;
    }

    startTurn() {
        clearInterval(this.timer);
        const isMyTurn = (this.turn === 0);
        document.getElementById('current-turn').innerText = isMyTurn ? "玩家(你)" : `AI ${this.turn}`;
        if (isMyTurn) {
            document.getElementById('btn-group').style.display = 'flex';
            this.startTimer();
        } else {
            document.getElementById('btn-group').style.display = 'none';
            document.getElementById('timer-ui').style.display = 'none';
            setTimeout(() => this.aiPlay(), 1200);
        }
    }

    startTimer() {
        this.timeLeft = 15;
        const ui = document.getElementById('timer-ui');
        ui.style.display = 'block';
        this.updateTimerUI();
        this.timer = setInterval(() => {
            this.timeLeft--;
            this.updateTimerUI();
            if (this.timeLeft <= 0) {
                clearInterval(this.timer);
                this.autoHandleTimeout();
            }
        }, 1000);
    }

    updateTimerUI() {
        document.getElementById('timer-text').innerText = this.timeLeft + 's';
        document.getElementById('timer-bar').style.width = (this.timeLeft / 15 * 100) + '%';
    }

    autoHandleTimeout() {
        if (this.lastMove.playerIdx === -1 || this.lastMove.playerIdx === 0) {
            this.selectedIndices.clear(); this.selectedIndices.add(this.players[0].length-1);
            this.playCards();
        } else { this.passTurn(); }
    }

    /**
     * 核心牌型判断（12种全覆盖）
     */
    analyze(cards) {
        if (!cards || cards.length === 0) return null;
        const v = cards.map(c => c.val).sort((a,b) => a - b);
        const len = v.length;
        const counts = {}; v.forEach(x => counts[x] = (counts[x] || 0) + 1);
        const freq = Object.entries(counts).map(([val, count]) => ({ val: parseInt(val), count })).sort((a,b) => b.count - a.count || b.val - a.val);
        const uniqueValues = freq.map(f => f.val).sort((a,b) => a-b);

        // 12. 火箭
        if (len === 2 && v[0] === 16 && v[1] === 17) return { type: 'rocket', power: 999 };
        // 11. 炸弹
        if (len === 4 && freq[0].count === 4) return { type: 'bomb', power: freq[0].val };
        // 1. 单张
        if (len === 1) return { type: 'single', power: v[0] };
        // 2. 对子
        if (len === 2 && v[0] === v[1]) return { type: 'pair', power: v[0] };
        // 3. 三张
        if (len === 3 && freq[0].count === 3) return { type: 'three', power: freq[0].val };
        // 4. 三带一
        if (len === 4 && freq[0].count === 3) return { type: 'three_one', power: freq[0].val };
        // 5. 三带二
        if (len === 5 && freq[0].count === 3 && freq[1].count === 2) return { type: 'three_two', power: freq[0].val };
        // 10. 四带二
        if (len === 6 && freq[0].count === 4) return { type: 'four_two', power: freq[0].val }; // 四带二单
        if (len === 8 && freq[0].count === 4 && freq[1].count === 2 && freq[2].count === 2) return { type: 'four_two_pairs', power: freq[0].val }; // 四带二对
        
        // 6. 单顺
        if (len >= 5 && v[len-1] < 15 && new Set(v).size === len && (v[len-1]-v[0] === len-1)) return { type: 'straight', power: v[0], len };
        // 7. 双顺
        if (len >= 6 && len % 2 === 0 && freq.every(f => f.count === 2) && (uniqueValues[uniqueValues.length-1] - uniqueValues[0] === uniqueValues.length-1) && uniqueValues[uniqueValues.length-1] < 15) return { type: 'double_straight', power: v[0], len: len/2 };
        
        // 8. 三顺 (飞机不带翅膀) / 9. 飞机带翅膀
        const threes = freq.filter(f => f.count >= 3).map(f => f.val).sort((a,b) => a-b);
        if (threes.length >= 2) {
            // 找最长连续三张
            for(let i=0; i <= threes.length - 2; i++) {
                let sequence = [threes[i]];
                for(let j=i+1; j<threes.length; j++) {
                    if(threes[j] === threes[j-1] + 1 && threes[j] < 15) sequence.push(threes[j]);
                    else break;
                }
                if (sequence.length >= 2) {
                    const sLen = sequence.length;
                    if (len === sLen * 3) return { type: 'plane_pure', power: sequence[0], len: sLen };
                    if (len === sLen * 4) return { type: 'plane_with_single', power: sequence[0], len: sLen };
                    if (len === sLen * 5 && freq.filter(f => f.count === 2).length >= sLen) return { type: 'plane_with_pair', power: sequence[0], len: sLen };
                }
            }
        }
        return null;
    }

    playCards() {
        const selected = Array.from(this.selectedIndices).map(i => this.players[0][i]);
        const move = this.analyze(selected);
        if (!move) return alert("不符合任何合法牌型！");

        if (this.lastMove.playerIdx !== -1 && this.lastMove.playerIdx !== 0) {
            const last = this.analyze(this.lastMove.cards);
            if (move.type === 'rocket') {} 
            else if (move.type === 'bomb' && last.type !== 'bomb' && last.type !== 'rocket') {}
            else if (move.type !== last.type || (move.len && move.len !== last.len) || move.power <= last.power) {
                return alert("牌型不符或点数不够大！");
            }
        }
        this.executeMove(0, selected);
        this.selectedIndices.clear(); this.renderPlayerCards();
    }

    passTurn() {
        if (this.lastMove.playerIdx === -1 || this.lastMove.playerIdx === 0) return alert("首出必须出牌！");
        this.log("玩家: 不出"); this.nextTurn();
    }

    executeMove(playerIdx, cards) {
        this.lastMove = { playerIdx, cards };
        cards.forEach(c => {
            const i = this.players[playerIdx].findIndex(p => p.val === c.val && (p.suit === c.suit || !c.suit));
            this.players[playerIdx].splice(i, 1);
        });
        const desk = document.getElementById('desk-cards');
        desk.innerHTML = '';
        cards.sort((a,b)=>b.val-a.val).forEach(c => desk.innerHTML += `<div class="card ${c.red?'red':''}">${c.name}</div>`);
        this.log(`P${playerIdx || '你'}: ${cards.map(c=>c.name).join('')}`);
        if (this.players[playerIdx].length === 0) {
            alert((playerIdx === this.landlordIdx) ? "地主获胜！" : "农民获胜！");
            location.reload(); return;
        }
        this.nextTurn();
    }

    nextTurn() {
        this.turn = (this.turn + 1) % 3;
        if (this.lastMove.playerIdx === this.turn) {
            this.lastMove = { playerIdx: -1, cards: [] }; 
            document.getElementById('desk-cards').innerHTML = '<span style="color:#ffd54f">新回合开始</span>';
        }
        this.startTurn();
    }

    aiPlay() {
        const hand = this.players[this.turn];
        let toPlay = [];
        if (this.lastMove.playerIdx === -1 || this.lastMove.playerIdx === this.turn) {
            toPlay = [hand[hand.length - 1]];
        } else {
            const last = this.analyze(this.lastMove.cards);
            if (last.type === 'single') {
                const b = hand.find(c => c.val > last.power); if (b) toPlay = [b];
            } else if (last.type === 'pair') {
                for(let i=hand.length-1; i>0; i--) { if(hand[i].val === hand[i-1].val && hand[i].val > last.power) { toPlay = [hand[i], hand[i-1]]; break; } }
            }
        }
        if (toPlay.length > 0) this.executeMove(this.turn, toPlay);
        else { this.log(`AI ${this.turn}: 不出`); this.nextTurn(); }
        this.renderPlayerCards();
    }
}
const game = new Game();
</script>
</body>
</html>
