<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake - Large Map Edition</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --snake-head: #00ff88;
            --snake-body: #00bd68;
            --food-color: #ff4d4d;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 95vw;
            max-width: 600px; /* Increased width for stats */
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        #game-container {
            position: relative;
            width: 95vw;
            max-width: 600px; /* Increased map size for desktop */
            aspect-ratio: 1 / 1;
            border: 3px solid #30363d;
            border-radius: 8px;
            background: #161b22;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: var(--snake-head);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .btn-dir {
            width: 60px;
            height: 60px;
            background: #21262d;
            color: var(--snake-head);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            user-select: none;
            border: 1px solid #30363d;
        }

        @media (min-width: 768px) {
            #controls { display: none; }
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="snakeGame"></canvas>
        <div id="overlay">
            <h2 id="msg">LARGE MAP MODE</h2>
            <button class="btn-start" onclick="startGame()">START</button>
        </div>
    </div>

    <div id="controls">
        <div style="grid-column: 2" class="btn-dir" onpointerdown="changeDir('UP')">▲</div>
        <div style="grid-column: 1" class="btn-dir" onpointerdown="changeDir('LEFT')">◀</div>
        <div style="grid-column: 2" class="btn-dir" onpointerdown="changeDir('DOWN')">▼</div>
        <div style="grid-column: 3" class="btn-dir" onpointerdown="changeDir('RIGHT')">▶</div>
    </div>

    <script>
        // Service Worker Logic Placeholder
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highscoreElement = document.getElementById("high-score");
        const overlay = document.getElementById("overlay");
        const msgText = document.getElementById("msg");

        // MAP ADJUSTMENTS
        const gridSize = 15; // Smaller grid units = more tiles on screen
        let tileCount;
        let score = 0;
        let highScore = localStorage.getItem("snakeHigh") || 0;
        highscoreElement.innerText = highScore;

        let snake = [];
        let food = {x: 5, y: 5};
        let dx = 0; let dy = 0;
        let nextDx = 0; let nextDy = 0;
        let isRunning = false;

        function resize() {
            const container = document.getElementById('game-container');
            const size = container.clientWidth;
            canvas.width = size;
            canvas.height = size;
            // Recalculate how many tiles fit in the new size
            tileCount = Math.floor(canvas.width / gridSize);
        }

        window.addEventListener('resize', resize);
        resize();

        function startGame() {
            resetGame();
            overlay.style.display = "none";
            isRunning = true;
            loop();
        }

        function loop() {
            if (!isRunning) return;
            if (didGameEnd()) {
                endGame();
                return;
            }

            setTimeout(() => {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                loop();
            }, 160); 
        }

        function clearCanvas() {
            ctx.fillStyle = "#161b22";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Optional: Draw subtle grid lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#00ff88" : "#00bd68";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
            });
        }

        function advanceSnake() {
            dx = nextDx; dy = nextDy;
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            if (dx === 0 && dy === 0) return false;
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function endGame() {
            isRunning = false;
            if(score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHigh", highScore);
                highscoreElement.innerText = highScore;
            }
            msgText.innerText = "GAME OVER";
            overlay.style.display = "flex";
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function drawFood() {
            ctx.fillStyle = "#ff4d4d";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
        }

        function changeDir(direction) {
            if (direction === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
            if (direction === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
            if (direction === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
            if (direction === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
        }

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp") changeDir('UP');
            if (e.key === "ArrowDown") changeDir('DOWN');
            if (e.key === "ArrowLeft") changeDir('LEFT');
            if (e.key === "ArrowRight") changeDir('RIGHT');
        });

        function resetGame() {
            // Start in the middle of the larger map
            const middle = Math.floor(tileCount / 2);
            snake = [{x: middle, y: middle}, {x: middle, y: middle+1}, {x: middle, y: middle+2}];
            score = 0;
            scoreElement.innerText = score;
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            createFood();
        }
    </script>
</body>
</html>
